name: Release automatisch anlegen

# Sobald die Version in manifest.json erhöht wird, legt GitHub selbst ein
# Release an (z. B. v1.1.5). HACS zeigt dann diese Versionsnummer an.
# Erst NACHDEM „Prüfen“ (HACS, hassfest, Tests) grün durchgelaufen ist –
# so will es HACS für die Aufnahme in die offizielle Liste.
on:
  workflow_run:
    workflows: ["Prüfen"]
    types: [completed]
    branches: [main, beta]   # 🧪 „beta“ = Testversionen (Vorabversion, nur für HACS „Beta-Versionen anzeigen“)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SHA }}

      - name: Version auslesen
        id: version
        run: echo "tag=v$(jq -r .version custom_components/airfryer_control/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Release anlegen (nur wenn es die Version noch nicht gibt)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          # 🧪 Sicherung: Auf „beta“ nur Versionen mit -beta, auf „main“ nie eine -beta
          PRE=""
          case "$TAG" in *-beta*) PRE="--prerelease";; esac
          if [ "$BRANCH" = "beta" ] && [ -z "$PRE" ]; then echo "Auf beta nur -beta-Versionen – nichts zu tun."; exit 0; fi
          if [ "$BRANCH" != "beta" ] && [ -n "$PRE" ]; then echo "-beta gehört auf den Zweig beta – nichts zu tun."; exit 0; fi
          # 📦 Fertig gepackte ZIP für HACS (hacs.json: zip_release + filename).
          # Drin ist nur der Inhalt von custom_components/airfryer_control/ –
          # HACS packt sie direkt in diesen Ordner aus. GitHub zählt jeden
          # Download dieser ZIP → das Download-Schild im README.
          ZIP="$(jq -r .filename hacs.json)"
          # 📥 Download-Zahl für die Credits: Summe aller ZIP-Downloads aller Releases bis jetzt.
          # Landet als www/downloads.json NUR in der ZIP (nicht im Repo). Die Karte liest sie
          # offline von Home Assistant – kein Aufruf an GitHub. Klappt die Abfrage nicht: 0 = keine Zeile.
          DL=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate \
            --jq '[.[].assets[] | select(.name | endswith(".zip")) | .download_count] | add // 0' 2>/dev/null \
            | awk '{s+=$1} END {print s+0}') || DL=0
          printf '{"downloads": %s, "stand": "%s"}\n' "${DL:-0}" "$(date -u +%F)" > custom_components/airfryer_control/www/downloads.json
          cat custom_components/airfryer_control/www/downloads.json
          ( cd custom_components/airfryer_control && zip -qr -X "$GITHUB_WORKSPACE/$ZIP" . -x '__pycache__/*' '*/__pycache__/*' '*.pyc' )
          unzip -l "$ZIP" | grep -q ' manifest.json$' || { echo "manifest.json fehlt in der ZIP"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon."
            # 📦 Fehlt dort die ZIP noch, wird sie nachgereicht
            if ! gh release view "$TAG" --json assets -q '.assets[].name' | grep -qxF "$ZIP"; then
              gh release upload "$TAG" "$ZIP"
            elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              # 📥 Von Hand gestartet und in der ZIP dort steht noch keine Download-Zahl
              # (z. B. weil sie mit der release.yml von main gebaut wurde) → ersetzen
              mkdir -p alt && gh release download "$TAG" -p "$ZIP" -D alt
              OLD_DL=$(unzip -p "alt/$ZIP" www/downloads.json 2>/dev/null | jq -r '.downloads // 0' 2>/dev/null || echo 0)
              if [ "${OLD_DL:-0}" = "0" ] && [ "${DL:-0}" != "0" ]; then
                gh release upload "$TAG" "$ZIP" --clobber
              fi
            fi
          else
            # 📝 Kurze deutsche Beschreibung: die Commit-Texte seit dem letzten Release
            PREV=$(git describe --tags --abbrev=0 --exclude '*-beta*' "$SHA^" 2>/dev/null || true)
            RANGE=${PREV:+$PREV..}$SHA
            {
              echo "## Was ist neu"
              git log "$RANGE" --no-merges --pretty=format:'- %s'
              echo
              [ -n "$PREV" ] && echo "**Alle Änderungen:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            } > notes.md
            if ! grep -q "^- " notes.md; then
              gh release create "$TAG" "$ZIP" --target "$SHA" --title "$TAG" $PRE --generate-notes
            else
              gh release create "$TAG" "$ZIP" --target "$SHA" --title "$TAG" $PRE --notes-file notes.md
            fi
          fi
