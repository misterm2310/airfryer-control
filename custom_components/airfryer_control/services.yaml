senden_testen:
  fields:
    geraet:
      required: true
      selector:
        device:
          integration: airfryer_control
    zone:
      default: 1
      selector:
        select:
          options:
            - "1"
            - "2"
            - "3"
    temperatur:
      default: 180
      selector:
        number:
          min: 35
          max: 240
          step: 5
          unit_of_measurement: "°C"
    minuten:
      default: 10
      selector:
        number:
          min: 1
          max: 1440
          mode: box
          unit_of_measurement: "min"
    programm:
      default: airfry
      selector:
        select:
          translation_key: programm
          options:
            - airfry
            - roast
            - bake
            - grill
            - reheat
            - dry
    variante:
      example: multi_c
      selector:
        text:
    alle:
      default: false
      selector:
        boolean:

garen_beenden:
  fields:
    geraet:
      required: true
      selector:
        device:
          integration: airfryer_control

befehl_senden:
  fields:
    geraet:
      required: true
      selector:
        device:
          integration: airfryer_control
    methode:
      required: true
      example: getAirfryerStatus
      selector:
        text:
    daten:
      example: "{}"
      selector:
        object:
