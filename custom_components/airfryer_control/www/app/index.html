// ---- Anmeldung (wie die Home-Assistant-App)
let auth = get(K.auth, null);
async function tokenRequest(body) {
  const r = await fetch("/auth/token", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams({ client_id: CLIENT_ID, ...body }) });
  if (!r.ok) throw Object.assign(new Error("token " + r.status), { status: r.status });
  const j = await r.json();
  return { access: j.access_token, refresh: j.refresh_token || auth?.refresh, expires: Date.now() + (j.expires_in || 1800) * 1000 - 60000 };
}
function startLogin() {
  const state = Math.random().toString(36).slice(2);
  try { sessionStorage.setItem(K.state, state); localStorage.setItem(K.state, state); } catch (_) { /* egal */ }
  location.href = "/auth/authorize?" + new URLSearchParams({ response_type: "code", client_id: CLIENT_ID, redirect_uri: CLIENT_ID, state });
}
async function finishLogin() {
  const q = new URLSearchParams(location.search);
  if (!q.get("code")) return;
  history.replaceState(null, "", BASE);
  let saved = null;
  try { saved = sessionStorage.getItem(K.state) || localStorage.getItem(K.state); localStorage.removeItem(K.state); } catch (_) { /* egal */ }
  if (!saved || q.get("state") !== saved) return; // ohne gemerkten Wert nie durchlassen
  auth = await tokenRequest({ grant_type: "authorization_code", code: q.get("code") });
  put(K.auth, auth);
}
async function accessToken() {
  if (auth && auth.expires > Date.now()) return auth.access;
  auth = { ...(await tokenRequest({ grant_type: "refresh_token", refresh_token: auth.refresh })), refresh: auth.refresh };
  put(K.auth, auth);
  return auth.access;
}
function logout() { auth = null; try { localStorage.removeItem(K.auth); } catch (_) { /* egal */ } location.replace(BASE); }

// ---- Verbindung zu Home Assistant
const WANT = /(zone_\d+|grandzone)/;
const states = {};
let ws = null, ready = false, msgId = 1, retry = null;
const pending = new Map();
const entities = {};
const hass = {
  states, entities, language: de ? "de" : "en", locale: { language: de ? "de" : "en" }, connected: false,
  callService: (domain, service, service_data) => raw({ type: "call_service", domain, service, service_data }),
};
const ours = new Set(); // Entitäten der Integration (aus der Registry) – klappt in jeder Sprache und mit jedem Gerätenamen
const wanted = (id) => ours.has(id) || WANT.test(id) || id === "binary_sensor.cosori_online";
let cards = [];
function push() { hass.connected = ready; for (const c of cards) c.hass = { ...hass, states: { ...states } }; }
function status() {
  document.body.classList.toggle("lost", !ready);
  $("msg").textContent = T("📴 Keine Verbindung – die Fritteuse ist gerade nicht erreichbar.", "📴 No connection – the air fryer is not reachable right now.");
}
function raw(msg) {
  return new Promise((ok, fail) => {
    if (!ready) { fail(new Error("offline")); return; } // bewusst nichts merken und später senden: ein verspäteter Befehl wäre gefährlich
    const id = msgId++; pending.set(id, { ok, fail }); ws.send(JSON.stringify({ id, ...msg }));
  });
}
function connect() {
  clearTimeout(retry);
  if (!auth || (ws && ws.readyState <= 1)) return;
  try { ws = new WebSocket(location.origin.replace(/^http/, "ws") + "/api/websocket"); } catch (_) { later(); return; }
  ws.onmessage = async (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "auth_required") {
      try { ws.send(JSON.stringify({ type: "auth", access_token: await accessToken() })); }
      catch (err) { if ([400, 401].includes(err.status)) logout(); else ws.close(); }
    } else if (m.type === "auth_invalid") { auth.expires = 0; put(K.auth, auth); ws.close(); }
    else if (m.type === "auth_ok") { ready = true; status(); loadStates(); }
    else if (m.type === "event") { applyEvent(m.event); }
    else if (m.type === "result") { const p = pending.get(m.id); if (p) { pending.delete(m.id); m.success ? p.ok(m.result) : p.fail(m.error || {}); } }
  };
  ws.onclose = () => { ready = false; for (const p of pending.values()) p.fail(new Error("lost")); pending.clear(); status(); push(); later(); };
  ws.onerror = () => { try { ws.close(); } catch (_) { /* egal */ } };
}
function later() { clearTimeout(retry); retry = setTimeout(connect, 5000); }
async function loadStates() {
  try {
    try { // Geräte-Zuordnung zuerst: welche Entitäten zur Integration gehören (für Zonen, Online und Match/Sync)
      const reg = await Promise.race([raw({ type: "config/entity_registry/list_for_display" }), new Promise((_, no) => setTimeout(no, 4000))]);
      for (const k of Object.keys(entities)) delete entities[k];
      ours.clear();
      for (const e of reg.entities || []) if (e.pl === "airfryer_control") ours.add(e.ei);
      for (const e of reg.entities || []) if (wanted(e.ei)) entities[e.ei] = { entity_id: e.ei, device_id: e.di, platform: e.pl, translation_key: e.tk };
    } catch (_) { /* egal – dann alte Namenssuche */ }
    const all = await raw({ type: "get_states" });
    for (const k of Object.keys(states)) delete states[k];
    for (const st of all) if (wanted(st.entity_id)) states[st.entity_id] = st;
    const ids = Object.keys(states);
    if (ids.length) { const id = msgId++; pending.set(id, { ok() {}, fail() {} }); ws.send(JSON.stringify({ id, type: "subscribe_entities", entity_ids: ids })); }
  } catch (_) { /* nächster Versuch beim erneuten Verbinden */ }
  push();
}
function applyEvent(ev) {
  for (const [id, v] of Object.entries(ev.a || {})) states[id] = { entity_id: id, state: v.s, attributes: v.a || {} };
  for (const [id, v] of Object.entries(ev.c || {})) {
    const old = states[id] || { entity_id: id, attributes: {} };
    const plus = v["+"] || {};
    states[id] = { ...old, state: plus.s ?? old.state, attributes: { ...old.attributes, ...(plus.a || {}) } };
  }
  push();
}

// ---- Bildschirm anlassen (Küchen-Tablet)
let lock = null;
async function toggleWake() {
  try {
    if (lock) { await lock.release(); lock = null; } else { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => { lock = null; wakeBtn(); }); }
  } catch (_) { /* nicht möglich – egal */ }
  wakeBtn();
}
function wakeBtn() { $("wake").textContent = lock ? T("🔆 Bildschirm bleibt an", "🔆 Screen stays on") : T("🔅 Bildschirm anlassen", "🔅 Keep screen on"); $("wake").style.display = "wakeLock" in navigator ? "" : "none"; }

// ---- Start
async function start() {
  $("loginTxt").textContent = T("Melde dich mit deinem Home-Assistant-Konto an.", "Sign in with your Home Assistant account.");
  $("loginBtn").textContent = T("Anmelden", "Sign in");
  $("loginBtn").onclick = startLogin;
  $("logout").textContent = T("Abmelden", "Sign out"); $("logout").onclick = logout;
  $("wake").onclick = toggleWake; wakeBtn();
  try { await finishLogin(); } catch (_) { /* Anmeldung fehlgeschlagen -> Anmeldeknopf */ }
  if (!auth) { document.body.classList.add("nologin"); return; }
  await import(`/airfryer_control_files/airfryer-control-card.js?v=${VER}`);
  const ticker = document.createElement("airfryer-control-ticker"); ticker.setConfig({ hide_when_idle: true, language: de ? "de" : "en" });
  const card = document.createElement("airfryer-control-card"); card.setConfig({ title: T("Heißluftfritteuse", "Air fryer") });
  $("cards").append(ticker, card); cards = [ticker, card];
  status(); connect();
  window.addEventListener("online", connect);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !ready) connect(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { scope: BASE }).catch(() => {});
}
start();
